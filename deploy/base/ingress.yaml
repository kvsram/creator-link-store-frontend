apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: creator-store-web
spec:
  ingressClassName: nginx
  rules:
    - host: creator.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: creator-store-web, port: { number: 80 } }
