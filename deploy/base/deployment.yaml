apiVersion: apps/v1
kind: Deployment
metadata:
  name: creator-store-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: creator-store-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: creator-store-web
    spec:
      containers:
        - name: web
          image: ghcr.io/kvsram/creator-link-store-frontend:latest
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
