map $request_uri $auth_page_cache_control {
  default "";
  ~^/(signup|login|verify-email|forgot-password|reset-password)(/|\?|$) "no-store";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 50m;
  client_body_timeout 60s;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  # Only private RFC1918/loopback peers may supply the forwarding chain. Direct public clients
  # cannot spoof it; behind an ALB/ingress, $remote_addr becomes the last untrusted client hop.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.0/8;
  set_real_ip_from ::1/128;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'" always;
  # The variable is empty for every non-auth route, so hashed assets retain normal caching.
  add_header Cache-Control $auth_page_cache_control always;

  location /api/ {
    proxy_pass http://creator-store-api:8080;
    proxy_set_header Host $host;
    # Overwrite client-supplied forwarding headers. The API trusts this internal proxy, not the
    # untrusted value a browser could place in X-Forwarded-For.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  location ~ ^/health(?:/|$) {
    proxy_pass http://creator-store-api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
  }

  location / { try_files $uri $uri/ /index.html; }
}
